name: Deploy

# Builds and publishes container images for the backend and frontend on
# every push to main. This workflow's deliverable IS the images landing in
# GHCR — there is no real deploy target wired up (no Kubernetes cluster, no
# cloud provider credentials exist for this project), so there is no final
# "ship it" step here. See the commented `deploy` job at the bottom for
# where that would go once a target and its secrets exist.

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository_owner | lower }}/${{ github.event.repository.name | lower }}-backend
  FRONTEND_IMAGE: ${{ github.repository_owner | lower }}/${{ github.event.repository.name | lower }}-frontend

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # No real deployment target exists yet for this project (no cluster, no
  # cloud credentials). When one does, add a job here gated on a GitHub
  # Environment (e.g. `environment: production`) so it only runs once that
  # environment's secrets are configured - leaving it ungated would fail
  # every run on missing secrets instead of just skipping. Sketch:
  #
  # deploy:
  #   needs: [build-backend, build-frontend]
  #   runs-on: ubuntu-latest
  #   environment: production
  #   steps:
  #     - name: Deploy backend
  #       run: |
  #         # e.g. kubectl set image deployment/backend backend=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
  #         # or: a cloud-run/ECS/fly.io deploy CLI call, using secrets.DEPLOY_*
  #         echo "no deploy target configured"
