[pytest]
# Pytest configuration for the SwingTrader backend test suite (tests/).
# Coverage settings live in pyproject.toml ([tool.coverage.*]).

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Per-test timeout in seconds (needs pytest-timeout, see requirements-test.txt)
timeout = 30

# Minimum pytest version
minversion = 3.8
