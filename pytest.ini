[pytest]
# Pytest configuration for Stock Data Download Agent tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for categorizing tests
markers =
    checkpoint: Checkpoint management tests
    ollama: Ollama integration tests
    vpn: VPN switching tests
    files: File operation tests
    watchlist: Watchlist parsing tests
    cache: Cache validation tests
    download: Download logic tests
    recording: Data recording tests
    verification: Data verification tests
    reporting: Report generation tests
    integration: Integration tests
    edge_cases: Edge case and boundary tests
    performance: Performance tests
    slow: Slow running tests
    smoke: Smoke tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Timeout for tests (seconds)
timeout = 30

# Minimum Python version
minversion = 3.8

# Coverage options
[coverage:run]
source = agent.py
omit =
    */tests/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
